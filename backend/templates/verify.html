{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/verify.css' %}">
    <title>تایید کد | انجمن علمی مکانیک</title>
</head>
<body>

    <!-- ==================== محتوای اصلی (تایید کد) ==================== -->
    <main class="verify-page-main">
        <div class="verify-container">
            <div class="verify-box">
                <div class="verify-header">
                    <div class="logo-text">
                        <h2>انجمن <span>مکانیک</span></h2>
                        <p>انجمن علمی مهندسی مکانیک</p>
                    </div>
                    <div class="logo-icon">⚙️</div>
                </div>

                <div class="verify-body">
                    <div class="verify-title">
                        <h1> تایید کد✅</h1>
                        <p>کد ۶ رقمی ارسال شده به شماره زیر را وارد کنید</p>
                    </div>

                    <div id="identifierDisplay" class="identifier-display">
                        <strong dir="ltr">0912***6789</strong>: شماره موبایل
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div class="error-message" id="errorMsg"></div>

                    <!-- فیلدهای OTP -->
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autofocus>
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                        <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
                    </div>

                    <!-- تایمر و ارسال مجدد -->
                    <div class="timer-section">
                        <span class="timer-text">
                            <i class="fa-regular fa-clock"></i>
                         زمان باقی‌مانده :  <span id="timerSeconds">120</span> ثانیه
                        </span>
                        <button id="resendBtn" class="resend-btn" disabled>ارسال مجدد کد</button>
                    </div>

                    <!-- دکمه تایید -->
                    <button id="verifyBtn" class="verify-btn" disabled>
                        تایید کد <i class="fa-solid fa-check"></i>
                    </button>

                    <!-- لودینگ -->
                    <div class="loading" id="loading" style="display:none;">
                        <div class="loading-spinner"></div>
                        <p>در حال تایید کد...</p>
                    </div>

                    <!-- لینک بازگشت -->
                    <div class="back-link">
                        <a href="/accounts/login/">
                            <i class="fa-solid fa-arrow-left"></i> بازگشت به صفحه ورود
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // ---- منوی همبرگری ----
            const toggleBtn = document.getElementById('menuToggle');
            const navMenu = document.getElementById('navMenu');
            if (toggleBtn && navMenu) {
                toggleBtn.addEventListener('click', function () {
                    navMenu.classList.toggle('active');
                });
            }

            // ---- دراپ‌داون ----
            const aboutUrl = "{% url 'about' %}";
            const industryUrl = "{% url 'industry' %}";

            const aboutLink = document.querySelector('.nav-list a[href="' + aboutUrl + '"]');
            const ulAbout = document.getElementById('ul-about');
            const relationLink = document.querySelector('.nav-list a[href="' + industryUrl + '"]');
            const ulRelation = document.getElementById('ul-relation');

            function setupDropdown(link, dropdown) {
                if (!link || !dropdown) return;
                const parent = link.closest('.dropdown');
                function show() { dropdown.style.display = 'block'; }
                function hide() { dropdown.style.display = 'none'; }
                if (parent) {
                    parent.addEventListener('mouseenter', show);
                    parent.addEventListener('mouseleave', hide);
                } else {
                    link.addEventListener('mouseover', show);
                    link.addEventListener('mouseout', hide);
                }
                dropdown.addEventListener('mouseover', show);
                dropdown.addEventListener('mouseout', hide);
            }
            setupDropdown(aboutLink, ulAbout);
            setupDropdown(relationLink, ulRelation);

        });

        // ============================================
        // منطق اصلی تایید کد (با همان JS قبلی)
        // ============================================
        const phoneNumber = localStorage.getItem("tempPhone") || "09123456789";
        document.querySelector('#identifierDisplay strong').textContent = phoneNumber.slice(0, 4) + '***' + phoneNumber.slice(-4);

        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById("verifyBtn");
        const errorDiv = document.getElementById("errorMsg");
        const loadingDiv = document.getElementById("loading");

        function toEnglishDigits(str) {
            if (!str) return '';
            return str
                .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        }

        function getCSRFToken() {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                const [name, value] = cookie.trim().split('=');
                if (name === 'csrftoken') {
                    return value;
                }
            }
            return '';
        }

        function getCode() {
            let code = '';
            inputs.forEach(input => {
                code += toEnglishDigits(input.value);
            });
            return code;
        }

        function checkComplete() {
            const code = getCode();
            verifyBtn.disabled = code.length !== 6;
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.style.display = "block";
            setTimeout(() => errorDiv.style.display = "none", 4000);
        }

        function setLoading(isLoading) {
            verifyBtn.disabled = isLoading;
            loadingDiv.style.display = isLoading ? "block" : "none";
            if (isLoading) errorDiv.style.display = "none";
        }

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                let value = toEnglishDigits(e.target.value);
                e.target.value = value;
                if (value && !/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                checkComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    if (input.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = '';
                    }
                    checkComplete();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                const digits = toEnglishDigits(pasted.replace(/\D/g, '')).slice(0, 6);
                digits.split('').forEach((digit, i) => {
                    if (i < inputs.length) {
                        inputs[i].value = digit;
                    }
                });
                if (digits.length < inputs.length) {
                    inputs[digits.length].focus();
                } else {
                    inputs[inputs.length - 1].focus();
                }
                checkComplete();
            });
        });

        let timerSeconds = 120;
        let timerInterval = null;

        function startTimer() {
            const timerSpan = document.getElementById("timerSeconds");
            const resendBtn = document.getElementById("resendBtn");

            if (timerInterval) clearInterval(timerInterval);

            timerSeconds = 120;
            resendBtn.disabled = true;
            resendBtn.style.opacity = "0.5";

            timerInterval = setInterval(() => {
                timerSeconds--;
                timerSpan.textContent = timerSeconds;

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    resendBtn.style.opacity = "1";
                    timerSpan.textContent = "۰";
                }
            }, 1000);
        }

        startTimer();

        document.getElementById("resendBtn").addEventListener("click", async () => {
            if (timerSeconds > 0) return;

            try {
                const response = await fetch("/accounts/send-otp/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },
                    body: JSON.stringify({
                        phone: phoneNumber
                    })
                });

                const data = await response.json();

                if (data.status === "sent") {
                    showError("📩 کد جدید ارسال شد!");
                    startTimer();
                    inputs.forEach(i => i.value = '');
                    inputs[0].focus();
                    verifyBtn.disabled = true;
                } else {
                    showError(data.message || "خطا در ارسال مجدد کد");
                }
            } catch (error) {
                console.error("Error resending OTP:", error);
                showError("خطا در ارتباط با سرور");
            }
        });

        verifyBtn.addEventListener("click", async () => {
            const code = getCode();

            if (code.length !== 6) {
                showError("لطفاً کد ۶ رقمی را کامل وارد کنید");
                return;
            }

            setLoading(true);

            try {
                const response = await fetch("/accounts/verify-otp/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },
                    body: JSON.stringify({ code: code })
                });

                const data = await response.json();

                if (response.ok) {
                    verifyBtn.textContent = "✓ تایید شد!";
                    setTimeout(() => {
                        window.location.href = data.redirect || "/panel/student/";
                    }, 1000);
                } else {
                    showError(data.message || "کد وارد شده صحیح نیست");
                    setLoading(false);
                    inputs.forEach(i => i.value = '');
                    inputs[0].focus();
                    verifyBtn.disabled = true;
                }
            } catch (error) {
                console.error("Error verifying OTP:", error);
                showError("خطا در ارتباط با سرور");
                setLoading(false);
            }
        });

        setTimeout(() => inputs[0].focus(), 200);
    </script>

</body>
</html>
