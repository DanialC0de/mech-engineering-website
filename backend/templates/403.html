<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دسترسی ندارید</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #f8f8fb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
            border-top: 6px solid #ff6b6b;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 28px;
            color: #d63031;
        }

        p {
            margin: 0 0 25px;
            font-size: 16px;
            line-height: 1.9;
            color: #555;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #6c5ce7;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            transition: 0.2s;
        }

        a:hover {
            background: #5a4bd6;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>شما به این بخش دسترسی ندارید</h1>
        <p>اگر فکر می‌کنید این پیام اشتباه است، با مدیر سایت تماس بگیرید یا به صفحه اصلی برگردید.</p>
        <a href="/">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
