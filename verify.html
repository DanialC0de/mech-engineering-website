<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/verify.css">
    <title>تایید هویت | انجمن علمی مکانیک</title>
    
</head>
<body>
    <div class="verify-container">
        <div class="verify-header">
            <div class="logo">⚙️ انجمن <span>مکانیک</span></div>
            <p>تایید هویت</p>
        </div>

        <div class="verify-body">
            <div class="error-message" id="errorMsg"></div>

            <div class="status-banner" id="statusBanner">
                <div class="status-icon" id="statusIcon">📱</div>
                <div class="status-title" id="statusTitle">در حال بررسی...</div>
                <div class="status-message" id="statusMessage">لطفاً منتظر بمانید</div>
            </div>

            <div class="identifier-display" id="identifierDisplay"></div>

            <div class="otp-container" id="otpContainer">
                <input type="text" class="otp-input" maxlength="1" data-index="0" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" data-index="1" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" data-index="2" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" data-index="3" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" data-index="4" inputmode="numeric">
                <input type="text" class="otp-input" maxlength="1" data-index="5" inputmode="numeric">
            </div>

            <div class="timer">
                <span id="timerSeconds">۱۲۰</span> ثانیه تا ارسال مجدد کد
                <button class="resend-btn" id="resendBtn" disabled>ارسال مجدد کد</button>
            </div>

            <button class="verify-btn" id="verifyBtn" disabled>تایید و ورود →</button>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>در حال بررسی کد...</p>
            </div>

            <div class="back-link">
                <a href="login.html">← بازگشت به صفحه ورود</a>
            </div>
        </div>

        <footer>
            <p>کد تایید به روش انتخابی شما ارسال شد</p>
        </footer>
    </div>

    <script src="js/verify.js"></script>
</body>
</html>
