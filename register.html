<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/register.css">
    <title>ثبت‌نام | انجمن علمی مکانیک</title>
</head>
<body>
    <div class="register-container">
        <div class="logo">⚙️ انجمن <span>مکانیک</span></div>
        <h2>ثبت‌نام در انجمن</h2>
        
        <div class="error" id="errorMsg">لطفاً تمام فیلدها را پر کنید</div>
        <div class="success" id="successMsg">✅ ثبت‌نام با موفقیت انجام شد! به صفحه ورود هدایت می‌شوید...</div>
        
        <form id="registerForm">
            <div class="form-row">
                <div class="input-group">
                    <label>نام</label>
                    <input type="text" id="firstName" placeholder="علی" required>
                </div>
                <div class="input-group">
                    <label>نام خانوادگی</label>
                    <input type="text" id="lastName" placeholder="رضایی" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>شماره دانشجویی</label>
                    <input type="text" id="studentId" placeholder="۴۰۱۱۲۳۴۵" required>
                </div>
                <div class="input-group">
                    <label>مقطع تحصیلی</label>
                    <select id="degree">
                        <option>کارشناسی</option>
                        <option>کارشناسی ارشد</option>
                        <option>دکتری</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>ایمیل سازمانی</label>
                <input type="email" id="email" placeholder="your.name@university.ac.ir" required>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>شماره تماس</label>
                    <input type="tel" id="phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required>
                </div>
                <div class="input-group">
                    <label>کمیته مورد نظر</label>
                    <select id="committee">
                        <option>آموزش</option>
                        <option>پژوهشی</option>
                        <option>صنعتی</option>
                        <option>اجرایی</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label>رمز عبور</label>
                    <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" required>
                </div>
                <div class="input-group">
                    <label>تکرار رمز عبور</label>
                    <input type="password" id="confirmPassword" placeholder="تکرار رمز عبور" required>
                </div>
            </div>
            
            <button type="submit" class="register-btn">✓ ثبت‌نام و عضویت</button>
        </form>
        
        <div class="links">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">ورود به حساب کاربری</a>
        </div>
    </div>
    
    <script src="js/register.js"></script>
</body>
</html>
